[workspace]
resolver = "2"
members = [
    "crates/ghostmesh-core",
    "crates/ghostmesh-net",
    "crates/ghostmesh-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Goksel Ozgur <gokselozgur5@gmail.com>"]
license = "MIT"
repository = "https://github.com/gokselozgur5/ghostmesh"

[workspace.dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
blake3 = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
